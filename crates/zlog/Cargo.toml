[package]
name = "gpui-pre-zlog"
version = "0.3.10"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "Zed's `zlog` crate (gpui-pre snapshot of zed@08cbb88)"
repository = "https://github.com/zed-industries/zed"

[package.metadata.gpui-pre]
zed-crate = "zlog"
zed-version = "0.1.0"
zed-rev = "08cbb88a152c3751a43e853425a70e9f631a5918"

[lib]
path = "src/zlog.rs"
doctest = false
name = "zlog"

[features]
default = []

[dependencies]
collections = { workspace = true }
chrono = { workspace = true, default-features = true }
log = { workspace = true, features = ["kv_unstable_std"] }
anyhow = { workspace = true }

[lints]
workspace = true
